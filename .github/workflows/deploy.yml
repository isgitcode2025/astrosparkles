name: CI/CD


on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run build

  web:
    name: Web · lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run ci:lint
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [api, web]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to the VPS
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          sudo apt-get update -y -qq && sudo apt-get install -y -qq sshpass
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='dist/' \
            -e "sshpass -e ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
            ./ "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/projects/astrosparkles.infosparkles.net/"

      - name: Rebuild and restart containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          command_timeout: 10m
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd /projects/astrosparkles.infosparkles.net

            echo "$GITHUB_SHA" > REVISION
            docker compose -f docker-compose.prod.yml up -d --build

            echo "Waiting for the API to come up..."
            for i in $(seq 1 15); do
              curl -fsS http://127.0.0.1:9301/api/v1/health >/dev/null 2>&1 && { echo "API is up."; exit 0; }
              sleep 3
            done
            echo "FATAL: API did not come up. Check: docker compose -f docker-compose.prod.yml logs --tail=100 api"
            exit 1
        env:
          GITHUB_SHA: ${{ github.sha }}
